<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>Space Station Vector: Sector Angle Repair</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@500;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-void:#05070d;
    --bg-panel:#0b1220;
    --bg-panel-2:#0f1b30;
    --line:rgba(90,180,255,0.14);
    --cyan:#48e3ff;
    --blue:#4d7dff;
    --orange:#ff9d43;
    --green:#49e8a4;
    --red:#ff5d72;
    --text:#dff2ff;
    --text-dim:#7d93bd;
    --font-display:'Orbitron',sans-serif;
    --font-body:'Rajdhani',sans-serif;
    --font-mono:'Share Tech Mono',monospace;
  }
  *{box-sizing:border-box;}
  html{color-scheme:dark;} /* forces native controls (select/option popups) to use a dark palette instead of the browser default light one */
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(ellipse at 20% -10%, rgba(77,125,255,0.15), transparent 55%),
      radial-gradient(ellipse at 90% 110%, rgba(72,227,255,0.10), transparent 50%),
      var(--bg-void);
    color:var(--text);
    font-family:var(--font-body);
    min-height:100vh;
    overflow-x:hidden;
  }
  /* subtle starfield */
  .starfield{
    position:fixed; inset:0; z-index:0; pointer-events:none; opacity:0.55;
    background-image:
      radial-gradient(1px 1px at 10% 20%, #fff, transparent),
      radial-gradient(1px 1px at 80% 10%, #fff, transparent),
      radial-gradient(1.5px 1.5px at 60% 70%, #cfe8ff, transparent),
      radial-gradient(1px 1px at 30% 85%, #fff, transparent),
      radial-gradient(1px 1px at 92% 60%, #cfe8ff, transparent),
      radial-gradient(1.5px 1.5px at 45% 35%, #fff, transparent),
      radial-gradient(1px 1px at 15% 55%, #fff, transparent),
      radial-gradient(1px 1px at 70% 90%, #fff, transparent);
    background-size:100% 100%;
  }
  .scanlines{
    position:fixed; inset:0; z-index:1; pointer-events:none; opacity:0.05;
    background:repeating-linear-gradient(to bottom, transparent 0px, transparent 2px, #cfe8ff 3px, transparent 4px);
    mix-blend-mode:overlay;
  }
  @media (prefers-reduced-motion: reduce){
    *{animation-duration:0.001ms !important; animation-iteration-count:1 !important; transition-duration:0.001ms !important;}
  }

  .app{position:relative; z-index:2; max-width:1180px; margin:0 auto; padding:18px 20px 60px;}

  header.topbar{
    display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between; gap:14px;
    padding:14px 20px; border:1px solid var(--line); border-radius:14px;
    background:linear-gradient(180deg, rgba(15,27,48,0.9), rgba(9,14,24,0.9));
    box-shadow:0 0 0 1px rgba(72,227,255,0.05), 0 8px 30px rgba(0,0,0,0.4);
    margin-bottom:20px;
  }
  .brand{display:flex; flex-direction:column; gap:2px;}
  .brand .eyebrow{
    font-family:var(--font-mono); font-size:11px; letter-spacing:3px; color:var(--cyan); opacity:0.85;
  }
  .brand h1{
    font-family:var(--font-display); font-weight:900; font-size:22px; margin:0;
    letter-spacing:1px;
    background:linear-gradient(90deg, var(--cyan), var(--blue) 60%, var(--orange));
    -webkit-background-clip:text; background-clip:text; color:transparent;
  }

  .level-tabs{display:flex; gap:8px; background:rgba(255,255,255,0.03); padding:5px; border-radius:10px; border:1px solid var(--line);}
  .level-tab{
    font-family:var(--font-display); font-size:11.5px; letter-spacing:1px; padding:9px 14px; border-radius:7px;
    background:transparent; color:var(--text-dim); border:none; cursor:pointer; transition:all .18s ease;
    white-space:nowrap;
  }
  .level-tab.active{
    background:linear-gradient(135deg, rgba(72,227,255,0.18), rgba(77,125,255,0.18));
    color:var(--text); box-shadow:inset 0 0 0 1px rgba(72,227,255,0.4);
  }
  .level-tab:hover:not(.active){color:var(--text);}

  .status-cluster{display:flex; align-items:center; gap:18px;}
  .energy-block{min-width:160px;}
  .energy-label{font-family:var(--font-mono); font-size:10px; color:var(--text-dim); letter-spacing:2px; display:flex; justify-content:space-between;}
  .energy-value{font-family:var(--font-mono); color:var(--orange);}
  .energy-bar{height:9px; border-radius:5px; background:rgba(255,255,255,0.06); overflow:hidden; margin-top:4px; border:1px solid rgba(255,255,255,0.08);}
  .energy-fill{height:100%; width:0%; background:linear-gradient(90deg, var(--cyan), var(--orange)); transition:width .5s ease; box-shadow:0 0 10px rgba(72,227,255,0.6);}
  .streak-badge{
    font-family:var(--font-display); font-size:12px; color:var(--bg-void); background:var(--orange);
    padding:6px 10px; border-radius:8px; box-shadow:0 0 14px rgba(255,157,67,0.55); white-space:nowrap;
  }
  .streak-badge.zero{background:rgba(255,255,255,0.08); color:var(--text-dim); box-shadow:none;}

  main.grid{
    display:grid; grid-template-columns:1.05fr 0.95fr; gap:20px; align-items:start;
  }
  @media (max-width:900px){
    main.grid{grid-template-columns:1fr;}
  }

  .panel{
    border:1px solid var(--line); border-radius:14px; padding:18px;
    background:linear-gradient(180deg, rgba(13,22,40,0.85), rgba(8,13,23,0.9));
    box-shadow:0 8px 30px rgba(0,0,0,0.35);
  }

  .diagram-panel{position:relative;}
  .sector-id{
    font-family:var(--font-mono); font-size:12px; color:var(--cyan); letter-spacing:2px; margin-bottom:2px;
  }
  .sector-name{
    font-family:var(--font-display); font-size:16px; margin:0 0 12px; color:var(--text);
  }
  .diagram-frame{
    position:relative; border-radius:12px; overflow:hidden;
    background:
      radial-gradient(circle at 50% 50%, rgba(72,227,255,0.10), transparent 60%),
      repeating-radial-gradient(circle at 50% 50%, rgba(72,227,255,0.05) 0px, rgba(72,227,255,0.05) 1px, transparent 1px, transparent 46px);
    border:1px solid rgba(72,227,255,0.15);
  }
  .diagram-frame svg{display:block; width:100%; height:auto; aspect-ratio:520/480;}

  .ray-line{stroke:#a9c3ee; stroke-width:2.8; opacity:1; stroke-linecap:round;}
  .ray-line.hint-active{
    stroke:var(--orange); stroke-width:3.2;
    filter:drop-shadow(0 0 6px rgba(255,157,67,0.9));
    animation:pulse-ray 1.1s ease-in-out infinite;
  }
  @keyframes pulse-ray{
    0%,100%{opacity:1;}
    50%{opacity:0.45;}
  }
  .vertex-dot{fill:var(--cyan); filter:drop-shadow(0 0 4px rgba(72,227,255,0.9));}
  .center-dot{fill:var(--text); }
  .vertex-label{font-family:var(--font-mono); font-size:15px; fill:#dff2ff;}
  .sector-arc{fill:none; stroke-width:2; stroke:var(--blue); opacity:0.75;}
  .sector-arc.target{stroke:var(--orange); stroke-width:2.6;}
  .sector-arc.target.solved{stroke:var(--green);}
  .sector-value{font-family:var(--font-mono); font-size:15px; fill:var(--text); font-weight:600;}
  .sector-value.target{fill:var(--orange); font-family:var(--font-display); font-size:16px;}
  .sector-value.target.solved{fill:var(--green);}

  .mission-brief{
    font-size:14.5px; color:var(--text-dim); line-height:1.5; margin:10px 0 16px; padding:10px 12px;
    border-left:2px solid var(--cyan); background:rgba(72,227,255,0.05); border-radius:0 8px 8px 0;
  }

  .control-panel h2{
    font-family:var(--font-display); font-size:15px; margin:0 0 14px; letter-spacing:1px; color:var(--text);
  }
  .field-row{display:flex; gap:12px; flex-wrap:wrap; margin-bottom:14px;}
  .field{flex:1; min-width:160px;}
  .field label{
    display:block; font-family:var(--font-mono); font-size:11px; letter-spacing:1.5px; color:var(--text-dim); margin-bottom:6px;
  }
  .deg-input-wrap{position:relative;}
  .deg-input-wrap input{
    width:100%; padding:11px 34px 11px 12px; border-radius:8px; border:1px solid var(--line);
    background:rgba(255,255,255,0.03); color:var(--text); font-family:var(--font-mono); font-size:18px;
    outline:none; transition:box-shadow .15s ease, border-color .15s ease;
  }
  .deg-input-wrap input:focus{border-color:var(--cyan); box-shadow:0 0 0 3px rgba(72,227,255,0.15);}
  .deg-input-wrap span{
    position:absolute; right:12px; top:50%; transform:translateY(-50%); color:var(--cyan); font-family:var(--font-mono); font-size:16px;
  }
  select{
    width:100%; padding:11px 12px; border-radius:8px; border:1px solid var(--line);
    background:rgba(255,255,255,0.03); color:var(--text); font-family:var(--font-body); font-size:15px; font-weight:600;
    outline:none; cursor:pointer; appearance:none;
    background-image:linear-gradient(45deg, transparent 50%, var(--cyan) 50%), linear-gradient(135deg, var(--cyan) 50%, transparent 50%);
    background-position: calc(100% - 18px) calc(50% - 3px), calc(100% - 13px) calc(50% - 3px);
    background-size:5px 5px, 5px 5px; background-repeat:no-repeat;
  }
  select:focus{border-color:var(--cyan); box-shadow:0 0 0 3px rgba(72,227,255,0.15);}
  /* Belt-and-braces: some browsers ignore color-scheme for <option> and default to
     black-on-white, which made the rule text unreadable on GitHub Pages. Force it. */
  select option{background:#0f1b30; color:#dff2ff;}

  .hint-row{display:flex; gap:10px; margin-bottom:14px;}
  .hint-btn{
    flex:1; padding:9px 10px; border-radius:8px; border:1px solid rgba(255,157,67,0.35);
    background:rgba(255,157,67,0.08); color:var(--orange); font-family:var(--font-body); font-weight:700; font-size:13px;
    cursor:pointer; transition:all .15s ease; display:flex; align-items:center; justify-content:center; gap:6px;
  }
  .hint-btn:hover:not(:disabled){background:rgba(255,157,67,0.18);}
  .hint-btn:disabled{opacity:0.35; cursor:not-allowed;}
  .hint-count{font-family:var(--font-mono); font-size:11px; opacity:0.8;}

  .action-row{display:flex; gap:10px; margin-bottom:14px;}
  .btn-primary{
    flex:1; padding:13px 14px; border-radius:9px; border:none; cursor:pointer;
    font-family:var(--font-display); font-size:14px; letter-spacing:1px;
    background:linear-gradient(135deg, var(--cyan), var(--blue)); color:#04101f;
    box-shadow:0 6px 20px rgba(72,227,255,0.25); transition:transform .12s ease, box-shadow .12s ease;
  }
  .btn-primary:hover{transform:translateY(-1px); box-shadow:0 8px 24px rgba(72,227,255,0.4);}
  .btn-primary:disabled{opacity:0.4; cursor:not-allowed; transform:none;}
  .btn-secondary{
    padding:13px 18px; border-radius:9px; cursor:pointer; font-family:var(--font-display); font-size:13px; letter-spacing:1px;
    background:rgba(73,232,164,0.12); color:var(--green); border:1px solid rgba(73,232,164,0.4);
  }
  .btn-secondary:hover{background:rgba(73,232,164,0.22);}

  .equation-box{
    display:none; font-family:var(--font-mono); font-size:15px; color:var(--cyan);
    background:rgba(72,227,255,0.06); border:1px dashed rgba(72,227,255,0.35); border-radius:8px;
    padding:10px 12px; margin-bottom:14px; letter-spacing:0.5px;
  }

  .log{
    font-family:var(--font-mono); font-size:13px; color:var(--text-dim);
    background:#040810; border:1px solid var(--line); border-radius:8px; padding:10px 12px;
    height:120px; overflow-y:auto; line-height:1.55;
  }
  .log .entry{margin-bottom:4px;}
  .log .entry.ok{color:var(--green);}
  .log .entry.bad{color:var(--red);}
  .log .entry.warn{color:var(--orange);}
  .log .entry.sys{color:var(--text-dim);}

  footer{text-align:center; color:var(--text-dim); font-family:var(--font-mono); font-size:11px; margin-top:22px; letter-spacing:1px; opacity:0.6;}

  ::-webkit-scrollbar{width:8px;}
  ::-webkit-scrollbar-thumb{background:rgba(72,227,255,0.25); border-radius:4px;}
</style>
</head>
<body>
<div class="starfield"></div>
<div class="scanlines"></div>

<div class="app">
  <header class="topbar">
    <div class="brand">
      <div class="eyebrow">STATION COMMAND DECK // GEOMETRY ENGINEERING</div>
      <h1>SPACE STATION VECTOR</h1>
    </div>

    <div class="level-tabs" role="tablist" aria-label="Difficulty level">
      <button class="level-tab active" data-tier="1" id="tabTier1">CADET ENGINEER</button>
      <button class="level-tab" data-tier="2" id="tabTier2">STATION MASTER</button>
    </div>

    <div class="status-cluster">
      <div class="energy-block">
        <div class="energy-label"><span>ENERGY</span><span class="energy-value" id="energyValue">0</span></div>
        <div class="energy-bar"><div class="energy-fill" id="energyFill"></div></div>
      </div>
      <div class="streak-badge zero" id="streakBadge">STREAK ×1.0</div>
    </div>
  </header>

  <main class="grid">
    <section class="panel diagram-panel">
      <div class="sector-id" id="sectorId">SECTOR α-01</div>
      <h2 class="sector-name" id="sectorName">Solar Array Alignment</h2>
      <div class="diagram-frame">
        <svg id="diagramSvg" viewBox="0 0 520 480" xmlns="http://www.w3.org/2000/svg"></svg>
      </div>
      <div class="mission-brief" id="missionBrief">Calculate the missing angle to stabilize this sector.</div>
    </section>

    <section class="panel control-panel">
      <h2>REPAIR PROTOCOL</h2>

      <div class="field-row">
        <div class="field">
          <label for="angleInput">SECTOR ANGLE VALUE</label>
          <div class="deg-input-wrap">
            <input type="number" id="angleInput" placeholder="___" inputmode="numeric">
            <span>°</span>
          </div>
        </div>
        <div class="field">
          <label for="ruleSelect">GEOMETRIC PROTOCOL</label>
          <select id="ruleSelect">
            <option value="">Select Geometric Rule...</option>
            <option value="straight">Angles on a straight line</option>
            <option value="vertical">Vertically opposite angles</option>
            <option value="point">Angles at a point</option>
          </select>
        </div>
      </div>

      <div class="hint-row">
        <button class="hint-btn" id="hint1Btn">💡 HINT 1: HIGHLIGHT <span class="hint-count" id="hint1Count">(1 left)</span></button>
        <button class="hint-btn" id="hint2Btn">📐 HINT 2: EQUATION <span class="hint-count" id="hint2Count">(1 left)</span></button>
      </div>

      <div class="equation-box" id="equationBox"></div>

      <div class="action-row">
        <button class="btn-primary" id="submitBtn">TRANSMIT REPAIR</button>
        <button class="btn-secondary" id="nextBtn" style="display:none;">NEXT SECTOR →</button>
      </div>

      <div class="log" id="log"></div>
    </section>
  </main>

  <footer>SPACE STATION VECTOR // SECTOR ANGLE REPAIR MODULE // P5 GEOMETRY TRAINING SIM</footer>
</div>

<script>
(function(){
  "use strict";

  // ---------- STATE ----------
  let tier = 1;
  let energy = 0;
  let streak = 0;
  let hintsUsedThisQ = 0;
  let attemptsThisQ = 0;
  let hint1Used = false, hint2Used = false;
  let currentQ = null;
  let solved = false;
  let sectorCount = 0;

  const RULE_LABELS = {
    straight:"Angles on a straight line",
    vertical:"Vertically opposite angles",
    point:"Angles at a point"
  };

  const SECTOR_NAMES = [
    "Solar Array Alignment","Comms Relay Vector","Propulsion Thruster Bay","Docking Clamp Array",
    "Coolant Truss Junction","Antenna Gimbal Node","Hull Plating Seam","Airlock Servo Ring",
    "Radiator Panel Hinge","Navigation Beacon Mount"
  ];

  // ---------- UTIL ----------
  function randInt(min,max){ return Math.floor(Math.random()*(max-min+1))+min; }
  function deg2rad(d){ return d*Math.PI/180; }
  function polar(cx,cy,r,angleDeg){
    const rad = deg2rad(angleDeg);
    return { x: cx + r*Math.cos(rad), y: cy - r*Math.sin(rad) };
  }
  function norm360(a){ a = a%360; if(a<0) a+=360; return a; }
  const LETTERS = "ABCDEFGHIJKLMNOP".split("");

  // ---------- QUESTION GENERATORS ----------

  function genT1StraightLine(){
    const a = randInt(20,160);
    const b = 180-a;
    const flip = Math.random()<0.5;
    const given = flip? b : a;
    const answer = flip? a : b;
    return {
      tier:1, kind:"straight-line",
      given, answer, correctRule:"straight",
      // geometry: OA at 180deg, OB at 0deg, OC splits at (180-given) if !flip else at (180-answer)
      build(){
        const angleAOC = flip ? answer : given; // the arc from A(180) toward B(0)
        const rays = [
          {angle:180, label:"A"},
          {angle:180-angleAOC, label:"C"},
          {angle:0, label:"B"}
        ];
        const sectors = [
          {from:180, to:180-angleAOC, value: flip?answer:given, isTarget: flip}, // AOC
          {from:180-angleAOC, to:0, value: flip?given:answer, isTarget: !flip}   // COB
        ];
        return {rays, sectors, lines:[[0,2]], hintRayAngles:[180-angleAOC,0,180]};
      },
      equation(){
        return `180° − ${given}° = ?`;
      },
      briefing:"Two rays meet a straight line at the station truss. Restore the missing sector angle."
    };
  }

  function genT1Vertical(){
    const a = randInt(20,160);
    return {
      tier:1, kind:"vertical",
      given:a, answer:a, correctRule:"vertical",
      build(){
        const cAngle = 180-a; // matches straight-line convention
        const dAngle = cAngle - 180; // keep continuous (not wrapped to 0-360) so the arc sweep math below stays correct
        const rays = [
          {angle:180, label:"A"},
          {angle:cAngle, label:"C"},
          {angle:0, label:"B"},
          {angle:dAngle, label:"D"}
        ];
        const sectors = [
          {from:180, to:cAngle, value:a, isTarget:false},        // AOC given
          {from:0, to:dAngle, value:a, isTarget:true, reflex:true} // BOD target (vertically opposite)
        ];
        return {rays, sectors, lines:[[0,2],[1,3]], hintRayAngles:[180,cAngle,0,dAngle]};
      },
      equation(){ return `∠AOC = ${a}°  ⇒  ∠BOD = ?`; },
      briefing:"Two relay trusses cross at the junction node. Vertically opposite sectors must match."
    };
  }

  function genT1Point(){
    let vals, tries=0, last;
    do{
      vals=[randInt(25,140),randInt(25,140),randInt(25,140)];
      last = 360-vals.reduce((s,v)=>s+v,0);
      tries++;
    } while((last<25||last>150) && tries<300);
    const all=[...vals,last];
    const idx = randInt(0,3);
    const answer = all[idx];
    const given = all.filter((_,i)=>i!==idx);
    return {
      tier:1, kind:"point",
      given, answer, correctRule:"point",
      build(){
        let acc=0;
        const rays=[]; const sectors=[];
        for(let i=0;i<4;i++){
          rays.push({angle:acc, label:LETTERS[i]});
          const val = all[i];
          sectors.push({from:acc, to:acc+val, value:val, isTarget:(i===idx)});
          acc+=val;
        }
        return {rays, sectors, lines:[], hintRayAngles: rays.map(r=>r.angle), fullPoint:true};
      },
      equation(){ return `360° − ${given.join("° − ")}° = ?`; },
      briefing:"Four thruster vanes radiate from the control hub. All sectors must sum to a full rotation."
    };
  }

  function genT1(){
    const pick = randInt(0,2);
    if(pick===0) return genT1StraightLine();
    if(pick===1) return genT1Vertical();
    return genT1Point();
  }

  // ---- TIER 2: concurrent-line star (n = 3 or 4 lines through a point) ----
  function genStarSectors(n){
    let s, tries=0;
    while(true){
      tries++;
      s=[]; let sum=0;
      for(let i=0;i<n-1;i++){ const v=randInt(18,145); s.push(v); sum+=v; }
      const lastVal = 180-sum;
      if(lastVal>=15 && lastVal<=150){ s.push(lastVal); break; }
      if(tries>800) { s=[60,60,60].slice(0,n); if(n===4)s=[45,45,45,45]; break; }
    }
    return s;
  }

  function genT2(){
    const n = Math.random()<0.6 ? 3 : 4;
    const s = genStarSectors(n);
    const sectors=[];
    for(let i=0;i<2*n;i++) sectors.push(s[i%n]);

    const flavor = Math.random()<0.5 ? "vertThenStraight" : "straightThenVert";
    const rot = randInt(0,2*n-1);
    const rotate = (i)=> (i+rot)%(2*n);

    let givenPos=[], givenVals=[], targetPos, answer, finalRule, chainText;

    if(flavor==="vertThenStraight"){
      for(let i=0;i<=n-3;i++){ givenPos.push(rotate(i)); givenVals.push(s[i]); }
      givenPos.push(rotate((n-2)+n)); givenVals.push(s[n-2]);
      targetPos = rotate(n-1);
      answer = s[n-1];
      finalRule="straight";
      const sumKnown = s.slice(0,n-1).reduce((a,b)=>a+b,0);
      chainText = `Step 1 — vertically opposite: hidden sector = ${s[n-2]}°.\nStep 2 — straight line: 180° − ${s.slice(0,n-1).join("° − ")}° = ${answer}°`;
    } else {
      for(let i=0;i<=n-2;i++){ givenPos.push(rotate(i)); givenVals.push(s[i]); }
      targetPos = rotate((n-1)+n);
      answer = s[n-1];
      finalRule="vertical";
      chainText = `Step 1 — straight line: 180° − ${s.slice(0,n-1).join("° − ")}° = ${answer}°.\nStep 2 — vertically opposite ⇒ x = ${answer}°`;
    }

    return {
      tier:2, kind:"star", n,
      given:givenVals, answer, correctRule:finalRule,
      build(){
        // compute ray absolute angles
        const rayAngles=[];
        let acc=0;
        for(let i=0;i<2*n;i++){ rayAngles.push(acc); acc+=sectors[i]; }
        const rays = rayAngles.map((a,i)=>({angle:a, label:LETTERS[i]}));
        const sectorDefs = sectors.map((val,i)=>{
          const gIdx = givenPos.indexOf(i);
          return {
            from: rayAngles[i], to: rayAngles[i]+sectors[i],
            value: (gIdx>-1)? givenVals[gIdx] : (i===targetPos? answer : null),
            isTarget: i===targetPos,
            isGiven: gIdx>-1,
            hide: !(gIdx>-1 || i===targetPos)
          };
        });
        const lines=[];
        for(let i=0;i<n;i++) lines.push([i, i+n]);
        const hintRayIdx = new Set();
        [...givenPos, targetPos].forEach(p=>{ hintRayIdx.add(p); hintRayIdx.add((p+1)%(2*n)); });
        const hintRayAngles = [...hintRayIdx].map(i=>rayAngles[i]);
        return {rays, sectors:sectorDefs, lines, hintRayAngles};
      },
      equation(){ return chainText; },
      briefing: n===3
        ? "Three transmission trusses intersect at the relay core. Trace the sequence: identify a hidden sector first, then solve the target."
        : "A four-truss interlocking network converges on the relay core. Multiple protocols apply in sequence — work step by step."
    };
  }

  function generateQuestion(){
    return tier===1 ? genT1() : genT2();
  }

  // ---------- SVG RENDERING ----------
  function buildSVG(q){
    const built = q.build();
    const cx=260, cy=250;
    const R = q.tier===1 ? 190 : 205;
    const svgns = "http://www.w3.org/2000/svg";
    let parts = [];

    // lines (full lines through O) or rays
    if(built.lines && built.lines.length){
      built.lines.forEach(([i,j])=>{
        const a1 = built.rays[i].angle, a2 = built.rays[j].angle;
        const p1 = polar(cx,cy,R,a1), p2 = polar(cx,cy,R,a2);
        parts.push(`<line class="ray-line" data-a1="${a1}" data-a2="${a2}" x1="${p1.x.toFixed(1)}" y1="${p1.y.toFixed(1)}" x2="${p2.x.toFixed(1)}" y2="${p2.y.toFixed(1)}"/>`);
      });
    } else {
      // separate rays from center (Tier1 "point" case)
      built.rays.forEach(r=>{
        const p = polar(cx,cy,R,r.angle);
        parts.push(`<line class="ray-line" data-a1="${r.angle}" data-a2="${r.angle}" x1="${cx}" y1="${cy}" x2="${p.x.toFixed(1)}" y2="${p.y.toFixed(1)}"/>`);
      });
    }

    // sector arcs + labels
    // Tier the arc radius by the order among VISIBLE sectors only (not raw array index),
    // so alternating spacing stays clean even when most sectors in the figure are hidden.
    // Tiers are kept far apart (48 vs 96, labels at +26) so a label at one tier's radius
    // can never sit close to another tier's arc radius, regardless of angle.
    let visibleCount = 0;
    built.sectors.forEach((sec)=>{
      if(sec.hide) return;
      const tier = visibleCount % 2;
      visibleCount++;
      const arcR = tier===0 ? 48 : 96;
      const from = sec.from, to = sec.to;
      const delta = to-from;
      const large = Math.abs(delta) > 180 ? 1 : 0;
      const p1 = polar(cx,cy,arcR, from);
      const p2 = polar(cx,cy,arcR, to);
      const sweep = delta < 0 ? 1 : 0;
      const targetCls = sec.isTarget ? " target" + (solved? " solved":"") : "";
      parts.push(`<path class="sector-arc${targetCls}" d="M ${p1.x.toFixed(1)} ${p1.y.toFixed(1)} A ${arcR} ${arcR} 0 ${large} ${sweep} ${p2.x.toFixed(1)} ${p2.y.toFixed(1)}"/>`);
      const mid = from + (to-from)/2;
      const lp = polar(cx,cy,arcR+26, mid);
      const label = sec.isTarget ? (solved? (sec.value+"°") : "?") : (sec.value+"°");
      parts.push(`<text class="sector-value${sec.isTarget? " target"+(solved?" solved":""):""}" x="${lp.x.toFixed(1)}" y="${lp.y.toFixed(1)}" text-anchor="middle" dominant-baseline="middle">${label}</text>`);
    });

    // center + vertices
    parts.push(`<circle class="center-dot" cx="${cx}" cy="${cy}" r="4"/>`);
    built.rays.forEach(r=>{
      const p = polar(cx,cy,R,r.angle);
      const lp = polar(cx,cy,R+22,r.angle);
      parts.push(`<circle class="vertex-dot" cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="4.5"/>`);
      parts.push(`<text class="vertex-label" x="${lp.x.toFixed(1)}" y="${lp.y.toFixed(1)}" text-anchor="middle" dominant-baseline="middle">${r.label}</text>`);
    });

    // center label O
    const op = polar(cx,cy,0,0);
    parts.push(`<text class="vertex-label" x="${cx+10}" y="${cy-8}" font-size="14">O</text>`);

    document.getElementById("diagramSvg").innerHTML = parts.join("");
    currentQ._hintRayAngles = built.hintRayAngles;
  }

  // ---------- GAME FLOW ----------
  function newQuestion(){
    currentQ = generateQuestion();
    solved = false;
    hintsUsedThisQ = 0; attemptsThisQ = 0; hint1Used=false; hint2Used=false;
    sectorCount++;

    document.getElementById("sectorId").textContent = `SECTOR ${greekLetter()}-${String(sectorCount).padStart(2,"0")}`;
    document.getElementById("sectorName").textContent = SECTOR_NAMES[randInt(0,SECTOR_NAMES.length-1)];
    document.getElementById("missionBrief").textContent = currentQ.briefing;
    document.getElementById("angleInput").value="";
    document.getElementById("ruleSelect").value="";
    document.getElementById("equationBox").style.display="none";
    document.getElementById("equationBox").textContent="";
    document.getElementById("submitBtn").disabled=false;
    document.getElementById("nextBtn").style.display="none";
    document.getElementById("hint1Btn").disabled=false;
    document.getElementById("hint2Btn").disabled=false;
    document.getElementById("hint1Count").textContent="(1 left)";
    document.getElementById("hint2Count").textContent="(1 left)";

    buildSVG(currentQ);
    logMsg("sys", `New diagnostic loaded — ${currentQ.tier===1?"CADET":"STATION MASTER"} tier.`);
  }

  const GREEK = ["α","β","γ","δ","ε","ζ","η","θ"];
  function greekLetter(){ return GREEK[(sectorCount-1)%GREEK.length]; }

  function logMsg(cls, text){
    const log = document.getElementById("log");
    const div = document.createElement("div");
    div.className = "entry "+cls;
    div.textContent = "> " + text;
    log.appendChild(div);
    log.scrollTop = log.scrollHeight;
  }

  function setEnergy(v){
    energy = Math.max(0, v);
    document.getElementById("energyValue").textContent = energy;
    const pct = Math.min(100, (energy%500)/5);
    document.getElementById("energyFill").style.width = pct+"%";
  }

  function updateStreakBadge(){
    const mult = (1 + Math.floor(streak/3)*0.5).toFixed(1);
    const el = document.getElementById("streakBadge");
    el.textContent = `STREAK ×${mult}  (${streak})`;
    el.className = "streak-badge" + (streak===0 ? " zero":"");
  }

  function checkAnswer(){
    if(solved) return;
    const valRaw = document.getElementById("angleInput").value;
    const rule = document.getElementById("ruleSelect").value;
    if(valRaw===""||rule===""){
      logMsg("warn","Enter both a sector value and a geometric protocol before transmitting.");
      return;
    }
    attemptsThisQ++;
    const val = Math.round(parseFloat(valRaw));
    const valOK = val === currentQ.answer;
    const ruleOK = rule === currentQ.correctRule;

    if(valOK && ruleOK){
      solved = true;
      streak++;
      const penalty = hintsUsedThisQ*20 + (attemptsThisQ-1)*15;
      const gained = Math.max(20, 100-penalty);
      const mult = 1 + Math.floor(streak/3)*0.5;
      setEnergy(energy + Math.round(gained*mult));
      updateStreakBadge();
      logMsg("ok", `SECTOR STABILIZED! Full diagnostic pass. +${Math.round(gained*mult)} energy.`);
      buildSVG(currentQ);
      document.getElementById("submitBtn").disabled=true;
      document.getElementById("nextBtn").style.display="inline-block";
      document.getElementById("hint1Btn").disabled=true;
      document.getElementById("hint2Btn").disabled=true;
    } else if(valOK && !ruleOK){
      streak = 0; updateStreakBadge();
      logMsg("bad","Calculation accurate, but protocol error! Re-check your geometric reasoning.");
    } else if(!valOK && ruleOK){
      streak = 0; updateStreakBadge();
      logMsg("bad","Reasoning sound, but mathematical error in sector alignment! Double-check your arithmetic.");
    } else {
      streak = 0; updateStreakBadge();
      logMsg("bad","Diagnostic failure! Re-evaluate both the diagram and your calculations.");
    }
  }

  function useHint1(){
    if(hint1Used) return;
    hint1Used = true; hintsUsedThisQ++;
    document.getElementById("hint1Btn").disabled=true;
    document.getElementById("hint1Count").textContent="(used)";
    const svg = document.getElementById("diagramSvg");
    const angles = currentQ._hintRayAngles || [];
    svg.querySelectorAll(".ray-line").forEach(line=>{
      const a1 = parseFloat(line.getAttribute("data-a1"));
      const a2 = parseFloat(line.getAttribute("data-a2"));
      if(angles.some(a=>Math.abs(norm360(a)-norm360(a1))<0.5 || Math.abs(norm360(a)-norm360(a2))<0.5)){
        line.classList.add("hint-active");
      }
    });
    logMsg("warn","Hint 1: relevant trusses highlighted on the diagram.");
  }

  function useHint2(){
    if(hint2Used) return;
    hint2Used = true; hintsUsedThisQ++;
    document.getElementById("hint2Btn").disabled=true;
    document.getElementById("hint2Count").textContent="(used)";
    const box = document.getElementById("equationBox");
    box.style.display="block";
    box.textContent = currentQ.equation();
    logMsg("warn","Hint 2: structural equation template revealed.");
  }

  function switchTier(t){
    tier = t;
    document.getElementById("tabTier1").classList.toggle("active", t===1);
    document.getElementById("tabTier2").classList.toggle("active", t===2);
    logMsg("sys", t===1 ? "Switched to CADET ENGINEER protocols." : "Switched to STATION MASTER protocols.");
    newQuestion();
  }

  // ---------- WIRE UP ----------
  document.getElementById("tabTier1").addEventListener("click", ()=>switchTier(1));
  document.getElementById("tabTier2").addEventListener("click", ()=>switchTier(2));
  document.getElementById("submitBtn").addEventListener("click", checkAnswer);
  document.getElementById("nextBtn").addEventListener("click", newQuestion);
  document.getElementById("hint1Btn").addEventListener("click", useHint1);
  document.getElementById("hint2Btn").addEventListener("click", useHint2);
  document.getElementById("angleInput").addEventListener("keydown", e=>{ if(e.key==="Enter") checkAnswer(); });

  setEnergy(0);
  updateStreakBadge();
  newQuestion();
})();
</script>
